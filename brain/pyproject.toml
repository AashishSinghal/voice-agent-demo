[project]
name = "voice-agent-brain"
version = "0.1.0"
description = "Reasoning service for the voice agent: LangGraph, context budgeting, cost control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.vercel]
entrypoint = "app.vercel:app"
